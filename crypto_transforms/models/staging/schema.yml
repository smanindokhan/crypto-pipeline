version: 2

models:
  - name: stg_coin_prices
    description: "Cleaned coin price snapshots from CoinGecko /coins/markets"
    columns:
      - name: coin_id
        description: "CoinGecko unique id e.g. bitcoin, ethereum"
        tests:
          - not_null
      - name: price_usd
        description: "Current price in USD at time of fetch"
        tests:
          - not_null
      - name: price_date
        description: "Calendar date of the fetch, derived from fetched_at"
        tests:
          - not_null
      - name: fetched_at
        description: "Full UTC timestamp of fetch"
        tests:
          - not_null

  - name: stg_global_market
    description: "Cleaned global crypto market snapshots"
    columns:
      - name: total_market_cap_usd
        description: "Total crypto market cap in USD"
        tests:
          - not_null
      - name: btc_dominance_pct
        description: "Bitcoin market dominance as a percentage"
        tests:
          - not_null
      - name: fetched_at
        tests:
          - not_null
          - unique